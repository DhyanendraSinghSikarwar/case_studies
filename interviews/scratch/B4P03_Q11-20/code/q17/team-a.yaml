apiVersion: v1
kind: Namespace
metadata:
  name: team-a
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trainer
  namespace: team-a
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-train-creds
  namespace: team-a
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["train-creds"]      # exactly one Secret
    verbs: ["get"]                      # and only get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trainer-reads-creds
  namespace: team-a
subjects:
  - kind: ServiceAccount
    name: trainer
    namespace: team-a
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-train-creds
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-a-quota
  namespace: team-a
spec:
  hard:
    requests.cpu: "40"
    requests.memory: 200Gi
    requests.nvidia.com/gpu: "4"        # quota names the extended resource with the requests. prefix
    pods: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: team-a-defaults
  namespace: team-a
spec:
  limits:
    - type: Container
      default: {cpu: "1", memory: 2Gi}          # limit used when a container sets none
      defaultRequest: {cpu: 250m, memory: 512Mi}
      max: {memory: 64Gi}
---
# The guard against self-promotion: this role may create RoleBindings but may only bind the 'edit' ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: team-binder
  namespace: team-a
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["edit"]
    verbs: ["bind"]                      # without 'bind' (or already holding the perms), binding a stronger role is refused
