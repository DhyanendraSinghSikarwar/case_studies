apiVersion: apps/v1
kind: Deployment
metadata: {name: model-api}
spec:
  replicas: 2
  selector: {matchLabels: {app: model-api}}
  template:
    metadata: {labels: {app: model-api}}
    spec:
      containers:
      - name: api
        image: registry.example.com/model-api:1.2.0
        resources: {requests: {cpu: 100m, memory: 256Mi}}
