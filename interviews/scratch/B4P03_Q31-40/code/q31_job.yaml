apiVersion: batch/v1
kind: Job
metadata:
  name: train-churn-001
  labels: {app: churn-train}
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: train
        image: registry.example.com/churn-train:1.4.2
        command: ["python", "train.py", "--epochs", "5"]
        resources:
          requests: {cpu: "2", memory: 4Gi}
          limits: {memory: 4Gi}
