apiVersion: v1
kind: Service
metadata:
  name: vecdb
spec:
  clusterIP: None            # headless: DNS returns pod IPs, gives each pod a stable name
  selector: {app: vecdb}
  ports:
  - {name: grpc, port: 6334}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vecdb
spec:
  serviceName: vecdb         # must match the headless Service
  replicas: 3
  podManagementPolicy: OrderedReady
  selector:
    matchLabels: {app: vecdb}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels: {app: vecdb}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: db
        image: registry.example.com/vector-db:2.3.1
        ports:
        - {containerPort: 6334, name: grpc}
        readinessProbe:
          tcpSocket: {port: 6334}
        resources:
          requests: {cpu: "1", memory: 4Gi}
          limits: {memory: 4Gi}
        volumeMounts:
        - {name: data, mountPath: /var/lib/vecdb}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests: {storage: 50Gi}
