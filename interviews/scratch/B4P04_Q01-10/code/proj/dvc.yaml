stages:
  prepare:
    cmd: python prepare.py
    deps:
      - prepare.py
    params:
      - prepare.seed
      - prepare.test_frac
    outs:
      - prepared.npz
  train:
    cmd: python train.py
    deps:
      - train.py
      - prepared.npz
    params:
      - train.C
    outs:
      - model.joblib
  evaluate:
    cmd: python evaluate.py
    deps:
      - evaluate.py
      - prepared.npz
      - model.joblib
    metrics:
      - metrics.json:
          cache: false
    plots:
      - roc.csv:
          x: fpr
          y: tpr
          cache: false
