[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "churn"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pandas>=2", "scikit-learn>=1.5", "joblib"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
churn = "churn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
