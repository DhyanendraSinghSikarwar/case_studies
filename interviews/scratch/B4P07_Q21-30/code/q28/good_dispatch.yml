name: debuggable
on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Print extra info"
        type: boolean
        default: false
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show context
        if: ${{ inputs.debug }}
        run: |
          echo "ref=${{ github.ref }}"
          python --version
      - run: echo "::debug::this line only shows with ACTIONS_STEP_DEBUG=true"
