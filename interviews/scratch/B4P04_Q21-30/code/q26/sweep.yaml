program: train.py
method: bayes
metric:
  name: val_auc
  goal: maximize
parameters:
  lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.1
  batch_size:
    values: [16, 32, 64]
  dropout:
    distribution: uniform
    min: 0.0
    max: 0.5
  optimizer:
    values: [adam, sgd]
early_terminate:
  type: hyperband
  min_iter: 3
  eta: 3
