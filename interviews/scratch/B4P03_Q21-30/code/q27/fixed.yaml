apiVersion: v1
kind: Service
metadata:
  name: model-api
spec:
  selector: {app: model-api}
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: model-api}
  template:
    metadata:
      labels: {app: model-api}
    spec:
      containers:
        - name: server
          image: registry.example.com/model-api:1.4.2
          args: ["serve", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
