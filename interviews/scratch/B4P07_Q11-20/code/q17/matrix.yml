name: ml-matrix
on:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        sklearn: ["1.3.2", "1.6.1"]
        exclude:
          - os: windows-latest
            python: "3.10"
        include:
          - os: ubuntu-latest
            python: "3.12"
            sklearn: "1.6.1"
            run_slow: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install "scikit-learn==${{ matrix.sklearn }}" pytest
      - run: pytest -q
