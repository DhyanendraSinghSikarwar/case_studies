name: build-serving-image
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # push to GHCR with GITHUB_TOKEN
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/churn-api
          tags: |
            type=sha
            type=semver,pattern={{version}}
      - name: Build (no push) for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: churn-api:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan, fail on HIGH or CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: churn-api:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - id: push
        name: Push (main and tags only)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
  deploy:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: echo "deploy ghcr.io/${{ github.repository }}/churn-api@${DIGEST}"
