name: rollback-model
on:
  workflow_dispatch:
    inputs:
      version:
        description: Registry version to restore (blank = previous champion)
        required: false
        type: string
      reason:
        description: Why we are rolling back
        required: true
        type: string
concurrency:
  group: promote-churn
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Roll back
        env:
          VERSION: ${{ inputs.version }}
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
        run: |
          python ledger.py --ledger ledger.jsonl --who "$ACTOR" --reason "$REASON" --version "$VERSION"
